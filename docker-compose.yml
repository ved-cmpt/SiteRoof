# Local development stack.
#   docker compose up -d db              -> SQL Server 2022 on localhost:1434 (for dotnet run / tests)
#   docker compose --profile full up -d  -> SQL Server + the single-container app on http://localhost:8080
# Requires a .env file (copy .env.example). Never commit .env.
name: siteroof

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: siteroof-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - siteroof-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    image: siteroof:local
    container_name: siteroof-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SiteRoof: "Server=db,1433;Database=SiteRoof;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Erp__BaseUrl: http://localhost:8080
      # Plain HTTP on localhost: allow non-Secure cookies and no proxy headers. Hosted deployments keep the defaults.
      Security__SecureCookies: "false"
      ForwardedHeaders__Enabled: "false"
      # Guest workspaces a single client may create per 15 minutes (raise for local end-to-end runs).
      Demo__ProvisionPermitsPerWindow: ${DEMO_PROVISION_PERMITS:-6}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  siteroof-sql:
