name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Anything outside docs and Markdown counts as a code change; docs-only changes skip the heavy jobs.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  backend:
    name: Backend build and tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SiteRoof.slnx
      - run: dotnet build SiteRoof.slnx --no-restore -c Release -warnaserror
      # Integration tests start SQL Server 2022 with Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test SiteRoof.slnx --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, test and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/web/browser

  e2e:
    name: Playwright end-to-end
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Throwaway password for the job's disposable database container (not a secret).
      MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-Sql!9a
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-Sql!9a
        ports:
          - 1434:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/web/browser
      - name: Wait for SQL Server
        run: |
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1434) 2>/dev/null; then echo "SQL Server port open"; sleep 10; exit 0; fi
            sleep 3
          done
          echo "SQL Server did not start" && exit 1
      - run: dotnet build api/SiteRoof.Api -c Debug
      - working-directory: tests/e2e
        run: npm ci
      - working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - working-directory: tests/e2e
        env:
          CI: "true"
          ConnectionStrings__SiteRoof: Server=127.0.0.1,1434;Database=SiteRoof;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
        run: npx playwright test --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore

  docker:
    name: Docker image build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: siteroof:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    name: ci-ok
    needs: [changes, backend, frontend, e2e, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded or were skipped for docs-only changes
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then echo "A required job ended with: $r"; exit 1; fi
          done
